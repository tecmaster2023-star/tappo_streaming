name: Build APK Tappo Streaming

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Backup pubspec.yaml e lib/
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib.bak

      - name: Remover android/ e ios/ existentes
        run: rm -rf android ios

      - name: Regenerar projeto Flutter Android
        run: flutter create --overwrite . --platforms android

      - name: Restaurar pubspec.yaml e lib/
        run: |
          cp pubspec.yaml.bak pubspec.yaml
          rm -rf lib
          cp -r lib.bak lib

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
