name: Build APK Tappo Streaming

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Backup pubspec.yaml e lib/
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib.bak

      - name: Install Android SDK Command-line Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip wget
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q -o cmdline-tools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools/* cmdline-tools/ 2>/dev/null || true
          rm -rf cmdline-tools/cmdline-tools cmdline-tools.zip
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/bin" >> $GITHUB_PATH

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --sdk_root=$HOME/android-sdk --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1

      - name: Aceitar licenças Android
        run: yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses > /dev/null 2>&1

      - name: Remover android/ e ios/ existentes
        run: rm -rf android ios

      - name: Regenerar projeto Android com Flutter
        run: flutter create --overwrite . --platforms android

      - name: Restaurar pubspec.yaml e lib/
        run: |
          cp pubspec.yaml.bak pubspec.yaml
          rm -rf lib
          cp -r lib.bak lib

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
