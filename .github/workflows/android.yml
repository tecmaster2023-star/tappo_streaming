name: Build APK Tappo Streaming

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Backup pubspec.yaml and lib/
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib.bak

      - name: Remove old native folders
        run: rm -rf android ios

      - name: Regenerate Flutter Android project
        run: flutter create --overwrite . --platforms android

      - name: Restore pubspec.yaml and lib/
        run: |
          cp pubspec.yaml.bak pubspec.yaml
          rm -rf lib
          cp -r lib.bak lib

      - name: Install NDK with retry
        run: |
          for attempt in 1 2 3; do
            echo "NDK install attempt $attempt..."
            if yes | sdkmanager --install "ndk;28.2.13676358"; then
              echo "NDK installed successfully"
              break
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
        continue-on-error: true

      - name: Prevent Gradle from downloading SDKs
        run: echo "android.builder.sdkDownload=false" >> android/gradle.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
