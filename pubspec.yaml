name: tappo_streaming
description: Aplicativo de streaming de canais de TV, filmes e séries via M3U licenciado.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  flutter_secure_storage: ^9.0.0
  http: ^1.2.0
  dio: ^5.4.0
  internet_connection_checker_plus: ^2.4.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.7
  connectivity_plus: ^6.0.5
  cached_network_image: ^3.3.0
  device_info_plus: ^11.1.0
  intl: ^0.18.1
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/placeholders/
